<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#071527" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>

    <!-- Glowing Orbs Radial Gradients -->
    <radialGradient id="orb-glow-teal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb-glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb-glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Text Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#fda085" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.45" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-12px) scale(1.03); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.65; }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes orbitCard {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      .anim-glow1 {
        animation: pulseGlow 6s ease-in-out infinite alternate;
      }
      .anim-glow2 {
        animation: pulseGlow 8s ease-in-out infinite alternate;
      }
      .anim-flow {
        stroke-dasharray: 8 8;
        animation: dashFlow 20s linear infinite;
      }
      .anim-float {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .anim-card {
        animation: orbitCard 6s ease-in-out infinite;
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bg-grad)" />

  <!-- Animated Glowing Orbs (in Background) -->
  <circle cx="200" cy="120" r="240" fill="url(#orb-glow-purple)" class="anim-glow1" />
  <circle cx="1020" cy="180" r="260" fill="url(#orb-glow-teal)" class="anim-glow2" />
  <circle cx="600" cy="350" r="200" fill="url(#orb-glow-blue)" class="anim-glow1" />

  <!-- Grid Overlay -->
  <rect width="1200" height="400" fill="url(#grid-pattern)" />

  <!-- Dynamic Animated Flow Rails (Connecting Fintech Nodes) -->
  <g fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.35" class="anim-flow">
    <path d="M 50 80 Q 300 20 600 80 T 1150 60" />
    <path d="M 50 340 Q 350 390 700 320 T 1150 340" />
    <path d="M 150 360 C 250 200, 950 200, 1050 50" stroke="#7928ca" stroke-opacity="0.25" />
  </g>

  <!-- Foreground Content Area: Perfectly Centered & High Contrast -->
  <g class="font-sans">
    <!-- Top Category Pill -->
    <g transform="translate(450, 42)">
      <rect x="0" y="0" width="300" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#00f2fe" stroke-opacity="0.5" stroke-width="1" />
      <circle cx="20" cy="17" r="5" fill="#00f2fe" />
      <text x="35" y="22" fill="#e2e8f0" font-size="12" font-weight="700" letter-spacing="1.5">CURATED ECOSYSTEM &amp; RAILS</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" font-size="52" font-weight="900" fill="url(#title-grad)" letter-spacing="-1">
      Awesome Business Banking
    </text>

    <!-- Subtitle (Clear, Readable) -->
    <text x="600" y="195" text-anchor="middle" font-size="20" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
      Modern Core Banking Engines • Double-Entry Ledgers • B2B Fintech SaaS • Treasury Rails
    </text>

    <!-- Dynamic Architectural Feature Pills (Foreground Layer) -->
    <g transform="translate(180, 245)">
      <!-- Pill 1: Core Banking -->
      <g transform="translate(0, 0)">
        <rect width="180" height="46" rx="12" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
        <text x="90" y="28" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">🏦 Core Banking</text>
      </g>

      <!-- Pill 2: Open-Source Ledgers -->
      <g transform="translate(210, 0)">
        <rect width="210" height="46" rx="12" fill="url(#card-grad)" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.2" />
        <text x="105" y="28" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">⚖️ Double-Entry Ledgers</text>
      </g>

      <!-- Pill 3: Treasury & Cards -->
      <g transform="translate(445, 0)">
        <rect width="200" height="46" rx="12" fill="url(#card-grad)" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.2" />
        <text x="100" y="28" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">💳 Treasury &amp; Cards</text>
      </g>

      <!-- Pill 4: ACH & Payments -->
      <g transform="translate(670, 0)">
        <rect width="170" height="46" rx="12" fill="url(#card-grad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.2" />
        <text x="85" y="28" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">⚡ ACH &amp; Real-Time</text>
      </g>
    </g>

    <!-- Bottom Metric / Tagline Banner -->
    <g transform="translate(360, 328)">
      <text x="240" y="20" text-anchor="middle" font-size="13" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
        ⚡ Open Financial Infrastructure for Founders, Engineers &amp; Institutions
      </text>
    </g>
  </g>
</svg>
